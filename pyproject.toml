[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-agent"
version = "0.1.0"
description = "Agentic chatbot for document querying, analysis, and summarization (LangGraph)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "chromadb>=1.5,<2",
    "pypdf>=5",
    "python-docx>=1.1",
    "langsmith>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]
studio = ["langgraph-cli[inmem]; python_version >= '3.11'"]
eval = ["ragas>=0.3.3,<1"]

[project.scripts]
doc-agent = "doc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: needs a real provider; runs only with DOC_AGENT_RUN_REAL=1"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
